name: Build Vi Tri Ao (APK)

on:
  push:
    branches: [main, 'claude/vi-tri-ao']
    paths: ['fakegps/**', '.github/workflows/build-fakegps.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        working-directory: fakegps
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp fakegps/app/build/outputs/apk/release/app-release.apk ViTriAo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ViTriAo-apk
          path: ViTriAo.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vitriao-latest
          name: Vị Trí Ảo (bản mới nhất)
          body: |
            Tải file **ViTriAo.apk** bên dưới về điện thoại Android rồi mở để cài.
            Bản build tự động từ commit ${{ github.sha }}.
          files: ViTriAo.apk
          make_latest: true
